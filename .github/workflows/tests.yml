name: API + UI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    name: API Tests (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run API tests
        run: mvn test -Dgroups="api"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api
          path: target/allure-results

  e2e-tests:
    name: E2E Tests (API + UI)
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Selenium Grid
        run: docker compose up -d
        
      - name: Wait for Grid to be ready
        run: |
          echo "Waiting for Selenium Grid..."
          sleep 15
          curl -sSL http://localhost:4444/status | grep -q '"ready": true'

      - name: Run E2E tests
        run: mvn test -Dgroups="e2e" -DHEADLESS=true

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-e2e
          path: target/allure-results
